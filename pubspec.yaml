name: umno
description: УМНО — мультики и задания для детей 3–7 лет.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_svg: ^2.0.10
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  webview_flutter: ^4.9.0
  video_player: ^2.9.0
  image_picker: ^1.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/google_fonts/
